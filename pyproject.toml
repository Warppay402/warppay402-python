[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "warppay402-mcp"
version = "1.2.6"
description = "Keyless, zero-API LangChain, LlamaIndex, & CrewAI tool suite for WarpPay402 x402 micropayment infrastructure across Base, Solana, Arbitrum, and Arc Mainnet."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
    "langchain-core>=0.1.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
llamaindex = [
    "llama-index-core>=0.10.0",
]

keywords = [
    "mcp",
    "model-context-protocol",
    "x402",
    "micropayments",
    "langchain",
    "llamaindex",
    "crewai",
    "ai-agents",
    "base-chain",
    "solana",
    "arc-mainnet"
]

[project.scripts]
warppay402-mcp = "warppay402_mcp.cli:main"